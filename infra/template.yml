AWSTemplateFormatVersion: '2010-09-09'
Description: Python Lambda producer and consumer for the news feed Kafka topic. Deploy in ap-southeast-1.

# Uses an existing role; this template creates or modifies no IAM resources.
# The role must trust lambda.amazonaws.com and already allow:
# logs:CreateLogStream, logs:PutLogEvents for the generated log group;
# secretsmanager:GetSecretValue for the two Kafka secrets;
# dynamodb:GetItem, dynamodb:UpdateItem on the outboxes table;
# dynamodb:DescribeStream, dynamodb:GetRecords, dynamodb:GetShardIterator,
# dynamodb:ListStreams on the outboxes stream;
# dynamodb:GetItem on the users table and dynamodb:Query on the followers table;
# sqs:SendMessage on the fanout queue;
# kms:Decrypt if the secrets use a customer-managed KMS key.
# The deploying principal needs iam:PassRole for this existing role.
Parameters:
  ExistingLambdaRoleArn:
    Type: String
    AllowedPattern: 'arn:[^:]+:iam::[0-9]{12}:role/.+'
    Description: Existing Lambda execution role ARN in this account. Its permissions are not changed.
  CodeBucket:
    Type: String
    Default: s3-source-bucket-nfee
  DeploymentVersion:
    Type: String
    AllowedPattern: '[0-9]{13}'
    Description: Millisecond timestamp used as the ZIP name under news-feed/kafka/deploy/.
  OutboxStreamArn:
    Type: String
    AllowedPattern: 'arn:[^:]+:dynamodb:ap-southeast-1:[0-9]{12}:table/outboxes/stream/.+'
    Description: EventSourceArn output from the news-feed DynamoDB stack.
  OutboxTableName:
    Type: String
    Default: outboxes
  UsersTableName:
    Type: String
    Default: users
  FollowersTableName:
    Type: String
    Default: followers
  CelebrityThreshold:
    Type: Number
    Default: 100000
    MinValue: 1
  FanoutBatchSize:
    Type: Number
    Default: 500
    MinValue: 1
    MaxValue: 500
  KafkaBootstrapServers:
    Type: CommaDelimitedList
    Default: kafka-webapp-adapham712-1bb4.k.aivencloud.com:20495
  KafkaTopic:
    Type: String
    Default: newsfeed.events
    MinLength: 1
  KafkaConsumerGroup:
    Type: String
    Default: newsfeed-lambda-consumer
    MinLength: 1
    Description: Dedicated consumer group. Existing committed offsets take precedence over StartingPosition.
  KafkaCredentialsSecretArn:
    Type: String
    AllowedPattern: 'arn:[^:]+:secretsmanager:ap-southeast-1:[0-9]{12}:secret:.+'
    Description: Existing secret in ap-southeast-1 with username and password JSON fields.
  KafkaCaSecretArn:
    Type: String
    AllowedPattern: 'arn:[^:]+:secretsmanager:ap-southeast-1:[0-9]{12}:secret:.+'
    Description: Existing secret in ap-southeast-1 with certificate field containing ca.pem text.
  TriggerEnabled:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Set false to create the trigger without consuming messages yet.
  StartingPosition:
    Type: String
    Default: TRIM_HORIZON
    AllowedValues: [TRIM_HORIZON, LATEST]
    Description: TRIM_HORIZON reads retained history for a new group; LATEST reads new messages.

Conditions:
  EnableTrigger: !Equals [!Ref TriggerEnabled, 'true']

Resources:
  FanoutDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AWS::StackName}-fanout-dlq'
      MessageRetentionPeriod: 1209600

  FanoutQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AWS::StackName}-fanout'
      VisibilityTimeout: 360
      MessageRetentionPeriod: 1209600
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt FanoutDeadLetterQueue.Arn
        maxReceiveCount: 5

  ProducerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RetentionInDays: 14

  ProducerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: news-feed-kafka-producer
      Description: Publishes DynamoDB outbox INSERT events to Aiven Kafka.
      Runtime: python3.12
      Architectures: [x86_64]
      Handler: lambda_function_producer.lambda_handler
      Role: !Ref ExistingLambdaRoleArn
      MemorySize: 256
      Timeout: 120
      LoggingConfig:
        LogGroup: !Ref ProducerLogGroup
      Environment:
        Variables:
          OUTBOX_TABLE_NAME: !Ref OutboxTableName
          KAFKA_BOOTSTRAP_SERVERS: !Join [',', !Ref KafkaBootstrapServers]
          KAFKA_TOPIC: !Ref KafkaTopic
          KAFKA_CREDENTIALS_SECRET_ARN: !Ref KafkaCredentialsSecretArn
          KAFKA_CA_SECRET_ARN: !Ref KafkaCaSecretArn
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Sub 'news-feed/kafka/deploy/${DeploymentVersion}.zip'

  OutboxEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !Ref OutboxStreamArn
      FunctionName: !Ref ProducerFunction
      StartingPosition: TRIM_HORIZON
      BatchSize: 1
      FunctionResponseTypes: [ReportBatchItemFailures]
      FilterCriteria:
        Filters:
          - Pattern: '{"eventName":["INSERT"]}'

  ConsumerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RetentionInDays: 14

  ConsumerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: news-feed-kafka-consumer
      Description: Consumes plain JSON outbox events from Aiven Kafka.
      Runtime: python3.12
      Architectures: [x86_64]
      Handler: lambda_function_consumer.lambda_handler
      Role: !Ref ExistingLambdaRoleArn
      MemorySize: 256
      Timeout: 120
      LoggingConfig:
        LogGroup: !Ref ConsumerLogGroup
      Environment:
        Variables:
          USERS_TABLE_NAME: !Ref UsersTableName
          FOLLOWERS_TABLE_NAME: !Ref FollowersTableName
          FANOUT_QUEUE_URL: !Ref FanoutQueue
          CELEBRITY_THRESHOLD: !Ref CelebrityThreshold
          FANOUT_BATCH_SIZE: !Ref FanoutBatchSize
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Sub 'news-feed/kafka/deploy/${DeploymentVersion}.zip'

  KafkaEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref ConsumerFunction
      Enabled: !If [EnableTrigger, true, false]
      BatchSize: 1
      MaximumBatchingWindowInSeconds: 1
      StartingPosition: !Ref StartingPosition
      Topics:
        - !Ref KafkaTopic
      SelfManagedEventSource:
        Endpoints:
          KafkaBootstrapServers: !Ref KafkaBootstrapServers
      SelfManagedKafkaEventSourceConfig:
        ConsumerGroupId: !Ref KafkaConsumerGroup
      SourceAccessConfigurations:
        - Type: BASIC_AUTH
          URI: !Ref KafkaCredentialsSecretArn
        - Type: SERVER_ROOT_CA_CERTIFICATE
          URI: !Ref KafkaCaSecretArn
      # Public brokers: no customer VPC configuration or provisioned pollers.
      # All advertised brokers must be publicly reachable and pass TLS checks.

Outputs:
  FanoutQueueUrl:
    Value: !Ref FanoutQueue
  FanoutQueueArn:
    Value: !GetAtt FanoutQueue.Arn
  FanoutDeadLetterQueueUrl:
    Value: !Ref FanoutDeadLetterQueue
  ProducerFunctionName:
    Value: !Ref ProducerFunction
  ProducerFunctionArn:
    Value: !GetAtt ProducerFunction.Arn
  OutboxEventSourceMappingId:
    Value: !Ref OutboxEventSourceMapping
  ProducerLogGroupName:
    Value: !Ref ProducerLogGroup
  FunctionName:
    Value: !Ref ConsumerFunction
  FunctionArn:
    Value: !GetAtt ConsumerFunction.Arn
  EventSourceMappingId:
    Value: !Ref KafkaEventSourceMapping
  LogGroupName:
    Value: !Ref ConsumerLogGroup
